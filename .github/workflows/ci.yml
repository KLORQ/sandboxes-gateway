name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download and verify dependencies
        run: go mod download && go mod verify

  tidy:
    name: Module Tidy
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check module files are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build packages
        run: go build ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

  vet:
    name: Vet
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Run race tests
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install pinned analyzers
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run strict lint
        run: |
          golangci-lint config verify
          golangci-lint run ./...

  vulnerability:
    name: Vulnerability
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan reachable vulnerabilities
        run: '$(go env GOPATH)/bin/govulncheck ./...'

  windows-build:
    name: Windows Build
    runs-on: windows-2022
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build Windows packages
        run: go build ./...

  windows-test:
    name: Windows Test
    runs-on: windows-2022
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Run Windows security contract tests
        run: go test -count=1 -run '^TestWindows' .

  sbom:
    name: Sbom
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install CycloneDX generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Generate module SBOM
        run: cyclonedx-gomod mod -json -licenses -test -type library -output "$RUNNER_TEMP/sandboxes-gateway.cdx.json" .
      - uses: actions/upload-artifact@v4
        with:
          name: sandboxes-gateway-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sandboxes-gateway.cdx.json
          if-no-files-found: error
          retention-days: 90
  go:
    if: always()
    needs:
      - dependencies
      - tidy
      - build
      - format
      - vet
      - test
      - lint
      - vulnerability
      - windows-build
      - windows-test
      - sbom
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A verification job returned: $result" >&2
              exit 1
            fi
          done
